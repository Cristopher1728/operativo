<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contabilidad Financiera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier New", Courier, monospace;
        }
        html, body {
            background-color: #000;
            color: #90EE90;
            min-height: 100vh;
            padding: 15px;
        }
        .contenedor {
            max-width: 500px;
            margin: 0 auto;
        }
        .titulo-principal {
            text-align: center;
            font-size: 1.8rem;
            color: #90EE90;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .caja {
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 25px;
            background-color: #0a0f0a;
        }
        .caja-saldos {
            border: 2px solid #90EE90;
        }
        .caja-registrar {
            border: 2px solid #2f4f2f;
        }
        .caja-cierre {
            border: 2px solid #FFD700;
        }
        .caja-movimientos {
            border: 2px solid #2f4f2f;
        }
        .caja-ultimo-cierre {
            border: 2px solid #FFD700;
        }
        .fila {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
        }
        .fila:last-child { border-bottom: none; }
        .etiqueta { font-weight: bold; }
        .valor { font-size: 1.1rem; }
        .negativo { color: #FF6347; }
        .positivo { color: #90EE90; }
        select, input {
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            color: #90EE90;
            margin: 5px 0;
            font-size: 1rem;
            width: 100%;
        }
        .fila-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .fila-form > * {
            flex: 1;
            min-width: 120px;
        }
        button {
            background-color: #000;
            border-radius: 8px;
            padding: 12px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            margin: 5px;
        }
        button:hover {
            background-color: #111;
        }
        .btn-guardar {
            border: 2px solid #90EE90;
            color: #90EE90;
        }
        .btn-limpiar {
            border: 2px solid #FF6347;
            color: #FF6347;
        }
        .btn-cierre {
            border: 2px solid #FFD700;
            color: #FFD700;
        }
        .btn-editar {
            border: 1px solid #90EE90;
            color: #90EE90;
            padding: 6px 10px;
            font-size: 0.85rem;
            margin: 0 0 0 5px;
        }
        .btn-eliminar {
            border: 1px solid #FF6347;
            color: #FF6347;
            padding: 6px 10px;
            font-size: 0.85rem;
            margin: 0 0 0 5px;
        }
        .botones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .movimiento {
            padding: 12px 0;
            border-bottom: 1px solid #222;
            font-size: 0.95rem;
        }
        .movimiento:last-child { border-bottom: none; }
        .movimiento-superior {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
        }
        .oculto { display: none; }
        .sin-datos {
            color: #555;
            font-style: italic;
            padding: 10px 0;
        }
        .editar-fila {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }
        .editar-input {
            flex: 1;
            min-width: 100px;
            background-color: #111;
            border: 1px solid #90EE90;
            border-radius: 6px;
            padding: 8px;
            color: #90EE90;
        }
        .btn-confirmar {
            background-color: #90EE90;
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-cancelar {
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1 class="titulo-principal">Contabilidad Financiera</h1>

        <!-- SALDOS -->
        <div class="caja caja-saldos">
            <div class="fila">
                <span class="etiqueta">Saldo Efectivo:</span>
                <span class="valor" id="saldoEfectivo">S/ 0.00</span>
            </div>
            <div class="fila">
                <span class="etiqueta">Saldo Plin/Yape:</span>
                <span class="valor" id="saldoPlin">S/ 0.00</span>
            </div>
            <div class="fila">
                <span class="etiqueta">Fecha:</span>
                <span class="valor" id="fechaHoy"></span>
            </div>
        </div>

        <!-- REGISTRAR MOVIMIENTO -->
        <div class="caja caja-registrar">
            <h3 class="etiqueta" style="margin-bottom: 10px;">Registrar Movimiento</h3>
            <div class="fila-form">
                <select id="tipoMov">
                    <option value="gasto">Gasto</option>
                    <option value="ingreso">Ingreso</option>
                </select>
                <select id="metodoPago">
                    <option value="efectivo">Efectivo</option>
                    <option value="plin">Plin/Yape</option>
                </select>
            </div>
            <input type="number" id="monto" step="0.10" placeholder="Monto">
            <input type="text" id="descripcion" placeholder="Descripción">
            <div class="botones">
                <button id="btnGuardar" class="btn-guardar">Guardar</button>
                <button id="btnLimpiar" class="btn-limpiar">Limpiar Todo</button>
                <button id="btnCerrarDia" class="btn-cierre">Cerrar Día</button>
            </div>
        </div>

        <!-- CIERRE DE DÍA -->
        <div class="caja caja-cierre oculto" id="seccionCierre">
            <h3 class="etiqueta" style="margin-bottom: 10px;">Cierre del Día</h3>
            <div class="fila-form">
                <label style="flex: 1;">
                    Efectivo real:
                    <input type="number" id="cierreEfectivo" step="0.10" placeholder="0.00">
                </label>
                <label style="flex: 1;">
                    Plin real:
                    <input type="number" id="cierrePlin" step="0.10" placeholder="0.00">
                </label>
            </div>
            <button id="btnConfirmarCierre" class="btn-cierre">Confirmar Cierre</button>
        </div>

        <!-- MOVIMIENTOS -->
        <div class="caja caja-movimientos">
            <h3 class="etiqueta" style="margin-bottom: 10px;">Movimientos</h3>
            <div id="listaMovimientos">
                <div class="sin-datos">Sin registros</div>
            </div>
        </div>

        <!-- ÚLTIMO CIERRE -->
        <div class="caja caja-ultimo-cierre oculto" id="ultimoCierre">
            <h3 class="etiqueta" style="margin-bottom: 10px; color: #FFD700;">Último Cierre</h3>
            <div id="datosCierre"></div>
        </div>
    </div>

    <script>
        // === VALORES INICIALES ===
        const SALDO_INICIAL_EFECTIVO = 23.00;
        const SALDO_INICIAL_PLIN = 230.00;

        // === VARIABLES GLOBALES ===
        let saldoEfectivo, saldoPlin, movimientos, cierreDiario, editandoId = null;

        // === CARGA DE DATOS AL INICIAR ===
        function cargarDatos() {
            const datosGuardados = localStorage.getItem('contabilidad_datos');
            
            if (datosGuardados) {
                const datos = JSON.parse(datosGuardados);
                saldoEfectivo = datos.saldoEfectivo;
                saldoPlin = datos.saldoPlin;
                movimientos = datos.movimientos || [];
                cierreDiario = datos.cierreDiario || null;
            } else {
                saldoEfectivo = SALDO_INICIAL_EFECTIVO;
                saldoPlin = SALDO_INICIAL_PLIN;
                movimientos = [];
                cierreDiario = null;
            }
            
            actualizarFecha();
            actualizarPantalla();
        }

        // === GUARDAR DATOS ===
        function guardarDatos() {
            const datos = {
                saldoEfectivo,
                saldoPlin,
                movimientos,
                cierreDiario,
                ultimaModificacion: new Date().toISOString()
            };
            localStorage.setItem('contabilidad_datos', JSON.stringify(datos));
            actualizarPantalla();
        }

        // === ACTUALIZAR FECHA ===
        function actualizarFecha() {
            const hoy = new Date();
            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fechaHoy').textContent = hoy.toLocaleDateString('es-PE', opciones);
        }

        // === ACTUALIZAR PANTALLA ===
        function actualizarPantalla() {
            document.getElementById('saldoEfectivo').textContent = `S/ ${saldoEfectivo.toFixed(2)}`;
            document.getElementById('saldoPlin').textContent = `S/ ${saldoPlin.toFixed(2)}`;

            const lista = document.getElementById('listaMovimientos');
            lista.innerHTML = '';
            
            if (movimientos.length === 0) {
                lista.innerHTML = '<div class="sin-datos">Sin registros</div>';
            } else {
                movimientos.slice().reverse().forEach((mov, idx) => {
                    const idReal = movimientos.length - 1 - idx;
                    const div = document.createElement('div');
                    div.className = `movimiento ${mov.tipo === 'gasto' ? 'negativo' : 'positivo'}`;
                    
                    if (editandoId === idReal) {
                        div.innerHTML = `
                            <div class="movimiento-superior">
                                <div>
                                    <strong>${mov.hora}</strong><br>
                                    ${mov.tipo === 'gasto' ? '-' : '+'}S/ ${mov.monto.toFixed(2)} (${mov.metodo})
                                </div>
                            </div>
                            <div class="editar-fila">
                                <input type="text" id="editar-desc-${idReal}" class="editar-input" value="${mov.descripcion}" placeholder="Descripción">
                                <input type="number" id="editar-monto-${idReal}" class="editar-input" value="${mov.monto}" step="0.10" placeholder="Monto">
                                <select id="editar-metodo-${idReal}" class="editar-input">
                                    <option value="efectivo" ${mov.metodo === 'efectivo' ? 'selected' : ''}>Efectivo</option>
                                    <option value="plin" ${mov.metodo === 'plin' ? 'selected' : ''}>Plin/Yape</option>
                                </select>
                                <button class="btn-confirmar" onclick="confirmarEdicion(${idReal})">✓</button>
                                <button class="btn-cancelar" onclick="cancelarEdicion()">✕</button>
                            </div>
                        `;
                    } else {
                        div.innerHTML = `
                            <div class="movimiento-superior">
                                <div>
                                    <strong>${mov.hora}</strong> — ${mov.descripcion}<br>
                                    ${mov.tipo === 'gasto' ? '-' : '+'}S/ ${mov.monto.toFixed(2)} (${mov.metodo})
                                </div>
                                <div>
                                    <button class="btn-editar" onclick="iniciarEdicion(${idReal})">Editar</button>
                                    <button class="btn-eliminar" onclick="eliminarMovimiento(${idReal})">Eliminar</button>
                                </div>
                            </div>
                        `;
                    }
                    lista.appendChild(div);
                });
            }

            if (cierreDiario) {
                document.getElementById('ultimoCierre').classList.remove('oculto');
                document.getElementById('datosCierre').innerHTML = `
                    <p><strong>Fecha:</strong> ${cierreDiario.fecha}</p>
                    <p><strong>Efectivo real:</strong> S/ ${cierreDiario.efectivoReal.toFixed(2)}</p>
                    <p><strong>Plin real:</strong> S/ ${cierreDiario.plinReal.toFixed(2)}</p>
                    <p><strong>Calculado:</strong> Efectivo S/ ${cierreDiario.efectivoCalc.toFixed(2)} | Plin S/ ${cierreDiario.plinCalc.toFixed(2)}</p>
                `;
            } else {
                document.getElementById('ultimoCierre').classList.add('oculto');
            }
        }

        // === REGISTRAR MOVIMIENTO ===
        function registrarMovimiento() {
            const tipo = document.getElementById('tipoMov').value;
            const monto = parseFloat(document.getElementById('monto').value);
            const descripcion = document.getElementById('descripcion').value.trim();
            const metodo = document.getElementById('metodoPago').value;

            if (!monto || monto <= 0) {
                alert('Por favor ingresa un monto válido');
                return;
            }
            if (!descripcion) {
                alert('Por favor ingresa una descripción');
                return;
            }


		if (tipo === 'gasto') {

                if (metodo === 'efectivo') saldoEfectivo -= monto;
                else saldoPlin -= monto;
            } else {
                if (metodo === 'efectivo') saldoEfectivo += monto;
                else saldoPlin += monto;
            }

            const ahora = new Date();
            const hora = ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
            
            movimientos.push({
                tipo,
                monto,
                descripcion,
                metodo,
                hora,
                fecha: ahora.toLocaleDateString('es-PE')
            });

            guardarDatos();

            // Limpiar campos
            document.getElementById('monto').value = '';
            document.getElementById('descripcion').value = '';
        }

        // === ELIMINAR MOVIMIENTO ===
        function eliminarMovimiento(indice) {
            if (!confirm('¿Eliminar este registro?')) return;
            
            const mov = movimientos[indice];
            
            // Devolver el dinero al saldo
            if (mov.tipo === 'gasto') {
                if (mov.metodo === 'efectivo') saldoEfectivo += mov.monto;
                else saldoPlin += mov.monto;
            } else {
                if (mov.metodo === 'efectivo') saldoEfectivo -= mov.monto;
                else saldoPlin -= mov.monto;
            }
            
            movimientos.splice(indice, 1);
            guardarDatos();
        }

        // === EDITAR MOVIMIENTO ===
        function iniciarEdicion(indice) {
            editandoId = indice;
            actualizarPantalla();
        }

        function confirmarEdicion(indice) {
            const movOriginal = movimientos[indice];
            const nuevaDesc = document.getElementById(`editar-desc-${indice}`).value.trim();
            const nuevoMonto = parseFloat(document.getElementById(`editar-monto-${indice}`).value);
            const nuevoMetodo = document.getElementById(`editar-metodo-${indice}`).value;

            if (!nuevaDesc || !nuevoMonto || nuevoMonto <= 0) {
                alert('Datos incompletos o incorrectos');
                return;
            }

            // Devolver valores originales
            if (movOriginal.tipo === 'gasto') {
                if (movOriginal.metodo === 'efectivo') saldoEfectivo += movOriginal.monto;
                else saldoPlin += movOriginal.monto;
            } else {
                if (movOriginal.metodo === 'efectivo') saldoEfectivo -= movOriginal.monto;
                else saldoPlin -= movOriginal.monto;
            }

            // Aplicar nuevos valores
            if (movOriginal.tipo === 'gasto') {
                if (nuevoMetodo === 'efectivo') saldoEfectivo -= nuevoMonto;
                else saldoPlin -= nuevoMonto;
            } else {
                if (nuevoMetodo === 'efectivo') saldoEfectivo += nuevoMonto;
                else saldoPlin += nuevoMonto;
            }

            movimientos[indice].descripcion = nuevaDesc;
            movimientos[indice].monto = nuevoMonto;
            movimientos[indice].metodo = nuevoMetodo;
            
            editandoId = null;
            guardarDatos();
        }

        function cancelarEdicion() {
            editandoId = null;
            actualizarPantalla();
        }

        // === CERRAR DÍA ===
        function mostrarCierre() {
            document.getElementById('seccionCierre').classList.remove('oculto');
            document.getElementById('cierreEfectivo').value = saldoEfectivo.toFixed(2);
            document.getElementById('cierrePlin').value = saldoPlin.toFixed(2);
        }

        function confirmarCierre() {
            const efectivoReal = parseFloat(document.getElementById('cierreEfectivo').value);
            const plinReal = parseFloat(document.getElementById('cierrePlin').value);

            if (isNaN(efectivoReal) || isNaN(plinReal)) {
                alert('Ingresa montos válidos para el cierre');
                return;
            }

            const hoy = new Date();
            cierreDiario = {
                fecha: hoy.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' }),
                efectivoReal,
                plinReal,
                efectivoCalc: saldoEfectivo,
                plinCalc: saldoPlin,
                totalMovimientos: movimientos.length
            };

            saldoEfectivo = efectivoReal;
            saldoPlin = plinReal;

            guardarDatos();
            
            document.getElementById('seccionCierre').classList.add('oculto');
            alert(`✅ Día cerrado:\nEfectivo: S/ ${efectivoReal.toFixed(2)}\nPlin: S/ ${plinReal.toFixed(2)}`);
        }

        // === LIMPIAR TODO ===
        function limpiarTodo() {
            if (!confirm('¿Borrar TODO y volver a valores iniciales?')) return;
            
            localStorage.removeItem('contabilidad_datos');
            saldoEfectivo = SALDO_INICIAL_EFECTIVO;
            saldoPlin = SALDO_INICIAL_PLIN;
            movimientos = [];
            cierreDiario = null;
            editandoId = null;
            
            guardarDatos();
            alert('✅ Reiniciado');
        }

        // === ASIGNAR EVENTOS ===
        document.getElementById('btnGuardar').addEventListener('click', registrarMovimiento);
        document.getElementById('btnLimpiar').addEventListener('click', limpiarTodo);
        document.getElementById('btnCerrarDia').addEventListener('click', mostrarCierre);
        document.getElementById('btnConfirmarCierre').addEventListener('click', confirmarCierre);

        // === INICIAR ===
        cargarDatos();
    </script>
</body>
</html>

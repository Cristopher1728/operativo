<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🚔 TABLERO HUACHO — FUNCIONA COMPLETO</title>
<style>
:root{
  --morado:#551a8b;
  --fondo:#f7f5ff;
  --tarjeta:#ffffff;
  --sombra:rgba(85,26,139,.2);
  --libre-claro:#dcfce7; --libre-fuerte:#16a34a;
  --oper-claro:#fee2e2; --oper-fuerte:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,Arial,sans-serif;background:var(--fondo);padding:16px;max-width:720px;margin:auto;}
h1{text-align:center;color:var(--morado);font-size:22px;}
.info{background:#ede9fe;border-left:4px solid var(--morado);padding:14px;border-radius:12px;margin:16px 0;text-align:center;line-height:1.5;}
.panel{background:var(--tarjeta);border-radius:18px;padding:20px;box-shadow:0 4px 12px var(--sombra);}
.fila{display:flex;align-items:center;justify-content:space-between;padding:16px 12px;border-bottom:1px solid #eee;flex-wrap:wrap;gap:14px;}
.fila:last-child{border-bottom:0;}
.nombre{font-size:17px;font-weight:600;flex:1;}
.valor{font-family:monospace;color:#555;padding:4px 10px;border-radius:8px;background:#f3f4f6;min-width:50px;text-align:center;}
.botones{display:flex;gap:12px;flex-wrap:wrap;}
.boton{
  border:3px solid transparent;
  border-radius:26px;
  font-weight:bold;
  padding:12px 18px;
  min-width:110px;
  font-size:16px;
  cursor:pointer;
  transition:all .25s ease;
}
.boton.libre{background:var(--libre-claro);color:#14532d;border-color:#bbf7d0;}
.boton.libre.activo{background:var(--libre-fuerte);color:white;border-color:#166534;box-shadow:inset 0 0 0 4px rgba(22,163,74,.25);}
.boton.operativo{background:var(--oper-claro);color:#7f1d1d;border-color:#fecaca;}
.boton.operativo.activo{background:var(--oper-fuerte);color:white;border-color:#b91c1c;box-shadow:inset 0 0 0 4px rgba(220,38,38,.25);}
.boton:disabled{opacity:.6;cursor:not-allowed;}
.estado{padding:14px;border-radius:12px;text-align:center;margin-top:18px;font-weight:500;}
.espera{background:#fffbeb;color:#92400e;}
.ok{background:#ecfdf5;color:#065f46;}
.err{background:#fef2f2;color:#991b1b;}
</style>
</head>
<body>

<h1>🚔 OPERATIVOS ZONA DE HUACHO - HUAHURA 🚔</h1>
<div class="info">
✅ Nombres iguales en ambos lados → el resalte se queda puesto ✨<br>
🟢 Libre = sin actividad | 🔴 Operativo = control activo — además verás el número confirmado 📌
</div>
<div id="aviso" class="estado espera">🔄 Conectando con base compartida…</div>
<div class="panel" id="contenedor"></div>

<script>
// ✅ RUTAS FIJAS Y SEGURAS — FUNCIONAN SIEMPRE CON TÚNEL / LOCAL
const URL_DATOS = "/datos";
const URL_GUARDAR = "/cambiar";
const INTERVALO = 2800;

// 📋 LISTA COMPLETA Y EXACTA (igual que servidor.py — sin tildes en ids internos)
const PUNTOS = [
  {id:"universidad", et:"🏫 Universidad"},
  {id:"mercedes", et:"🛣️ Av_Mercedes_Indacochea"},
  {id:"plaza_armas", et:"🏛️ Plaza_Armas"},
  {id:"atahualpa", et:"🔄 Atahualpa"},
  {id:"ovalo", et:"🔵 Óvalo Huacho"},
  {id:"veintiocho", et:"📅 Av_28_Julio"},
  {id:"plaza_sol", et:"☀️ Plaza_Sol"},
  {id:"puente", et:"🌉 Puente Huahura"}
];

// 🎨 PINTAR TODO LIMPIO Y RESALTADO
function mostrarTablero(estado){
  const caja = document.getElementById("contenedor");
  caja.innerHTML = "";
  PUNTOS.forEach(lugar=>{
    const valor = estado[lugar.id] ?? 0;
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.innerHTML = `
      <span class="nombre">${lugar.et}</span>
      <span class="valor">📌${valor}</span>
      <div class="botones">
        <button class="boton libre ${valor===0?'activo':''}" 
                onclick="cambiarEstado('${lugar.id}', 0, this)">🟢 LIBRE</button>
        <button class="boton operativo ${valor===1?'activo':''}" 
                onclick="cambiarEstado('${lugar.id}', 1, this)">🔴 OPERATIVO</button>
      </div>
    `;
    caja.appendChild(fila);
  });
  document.getElementById("aviso").className="estado ok";
  document.getElementById("aviso").textContent="✅ SINCRONIZADO — Grupo conectado y actual ✅";
}

// 💾 FUNCIÓN DE CAMBIO: BLOQUEA, ENVÍA Y CONFIRMA DESDE SERVIDOR
async function cambiarEstado(id, valor, boton){
  const fila = boton.closest(".fila");
  fila.querySelectorAll(".boton").forEach(b=>b.disabled=true);
  document.getElementById("aviso").className="estado espera";
  document.getElementById("aviso").textContent="📤 Guardando posición para todos…";

  try{
    const respuesta = await fetch(URL_GUARDAR, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id: id, valor: valor})
    });
    if(!respuesta.ok) throw new Error("Fallo red");
    await recargarDatos(); // ← LECTURA REAL, NO ADIVINA
  }catch(err){
    document.getElementById("aviso").className="estado err";
    document.getElementById("aviso").textContent="❌ Desconectado / revisa túnel o servidor";
    fila.querySelectorAll(".boton").forEach(b=>b.disabled=false);
  }
}

// 🔄 LECTURA FIABLE: PREGUNTA AL SERVIDOR VERDADERO CADA VEZ
async function recargarDatos(){
  try{
    const resp = await fetch(URL_DATOS + "?" + Date.now()); // evita caché
    const datos = await resp.json();
    mostrarTablero(datos);
  }catch(e){
    document.getElementById("aviso").className="estado err";
    document.getElementById("aviso").textContent="📉 Sin conexión central / revisa enlace";
  }
}

// 🚀 ARRANQUE Y VIGILANCIA PERIÓDICA AUTOMÁTICA
document.addEventListener("DOMContentLoaded", ()=>{
  recargarDatos();
  setInterval(recargarDatos, INTERVALO);
});
</script>
</body>
</html>
